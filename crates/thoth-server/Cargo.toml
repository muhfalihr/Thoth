[package]
name        = "thoth-server"
version.workspace = true
edition     = "2024"
description = "Thoth REST + SSE server (dashboard backend)"

[lib]
name = "thoth_server"
path = "src/lib.rs"

[[bin]]
name = "thoth-server"
path = "src/main.rs"

[dependencies]
# The server links NO heavy deps (ffmpeg/wgpu/CUDA/Whisper) — only the shared
# job types + SQLite. It and the worker are independent peers that meet solely
# in the SQLite/WAL job database (see docs/…/worker-queue-sqlite-design.md).
thoth-jobs   = { path = "../thoth-jobs" }
sqlx         = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio        = { version = "1", features = ["full"] }
axum         = "0.7"
tower        = "0.5"
tower-http   = { version = "0.6", features = ["fs", "trace"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
anyhow       = "1"
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid         = { version = "1", features = ["v4"] }
chrono       = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
async-stream = "0.3"
toml         = "0.8"
tokio-util   = { version = "0.7", features = ["io"] }
dotenvy      = "0.15"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
