[workspace]
resolver = "2"
members  = ["crates/thoth-types", "crates/thoth-jobs", "crates/thoth-core", "crates/thoth", "crates/thoth-server"]

# Single source of truth for the version shared by every crate. Bump here and each
# member inherits it via `version.workspace = true`. Keep in sync with
# dashboard/package.json.
[workspace.package]
version = "0.1.0"

[workspace.lints.clippy]
# Standar linter untuk repositori Thoth — diinherit oleh semua member workspace.
# Menggunakan beberapa rekomendasi ketat (pedantic) dengan prioritas lebih rendah.
pedantic                 = { level = "warn", priority = -1 }
module_name_repetitions  = "allow"
missing_errors_doc        = "allow"
missing_panics_doc        = "allow"
must_use_candidate        = "allow"
cast_possible_truncation  = "allow"
cast_precision_loss       = "allow"
cast_sign_loss            = "allow"
too_many_lines            = "allow"
struct_excessive_bools    = "allow"
doc_markdown              = "allow"
cast_lossless             = "allow"
map_unwrap_or             = "allow"
unwrap_used               = "warn"
todo                      = "warn"

[profile.release]
opt-level = 3
lto       = "thin"
strip     = true
