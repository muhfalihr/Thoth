name: Container image

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: container-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY_IMAGE: ghcr.io/muhfalihr/thoth

jobs:
  quality:
    name: Offline quality gates
    runs-on: ubuntu-latest
    env:
      THOTH_FFMPEG: /usr/bin/ffmpeg
      THOTH_FFPROBE: /usr/bin/ffprobe
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install media test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          test -x "$THOTH_FFMPEG"
          test -x "$THOTH_FFPROBE"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.10.8"
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install locked Python dependencies
        run: uv sync --project python --frozen --all-groups --extra acquisition

      - name: Run Python non-live tests
        run: uv run --project python pytest -m "not live" -q

      - name: Run Ruff checks
        run: |
          uv run --project python ruff check python/src python/tests
          uv run --project python ruff format --check python/src python/tests

      - name: Validate local Stage 1 Compose
        run: docker compose --env-file .env.stage1.local.example -f compose.stage1.local.yml config --quiet

      - name: Install locked Scout dependencies
        run: bun --cwd=scout install --frozen-lockfile

      - name: Run Scout acquisition regressions
        run: bun --cwd=scout run test:acquisition

  validate-image:
    name: Validate image build
    if: github.event_name == 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=thoth-container
          cache-to: type=gha,mode=max,scope=thoth-container

  publish-image:
    name: Publish image
    if: github.event_name == 'push'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
          labels: |
            org.opencontainers.image.title=Thoth Stage 1 compatibility runtime
            org.opencontainers.image.description=Python TikTok acquisition with temporary Scout fallback
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=thoth-container
          cache-to: type=gha,mode=max,scope=thoth-container
          provenance: mode=max
          sbom: true

      - name: Record immutable release identity
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "## Published container image"
            echo
            echo "- Repository: ${REGISTRY_IMAGE}"
            echo "- Git revision: ${GITHUB_SHA}"
            echo "- Platform: linux/amd64"
            echo "- Digest: ${IMAGE_DIGEST}"
            echo
            echo "### Tags"
            echo '```text'
            printf '%s\n' "${IMAGE_TAGS}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

  stack-smoke:
    name: Non-live stack smoke
    if: github.event_name == 'push'
    needs: publish-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      COMPOSE_FILE_ARGS: --env-file ${{ runner.temp }}/stage1.env -f compose.stage1.local.yml
      THOTH_IMAGE_REF: ghcr.io/muhfalihr/thoth@${{ needs.publish-image.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.10.8"
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Prepare a data root outside the checkout
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/thoth-stage1"
          mkdir -p "${root}"/postgres "${root}"/artifacts "${root}"/browser-profile
          mkdir -p "${root}"/observations "${root}"/reports
          sudo chown -R 10001:10001 "${root}/artifacts" "${root}/browser-profile"
          chmod 750 "${root}/artifacts" "${root}/browser-profile"

      - name: Write a throwaway local environment
        run: |
          set -euo pipefail
          umask 077
          {
            echo "COMPOSE_PROJECT_NAME=thoth-stage1-ci"
            echo "THOTH_IMAGE=${THOTH_IMAGE_REF}"
            echo "THOTH_STAGE1_DATA_ROOT=${RUNNER_TEMP}/thoth-stage1"
            echo "THOTH_STAGE1_ACTIVITY_MODE=python_tiktok_with_legacy_fallback"
            echo "THOTH_CONTROL_PLANE_API_KEY=$(openssl rand -hex 24)"
            echo "THOTH_POSTGRES_PASSWORD=$(openssl rand -hex 24)"
          } > "${RUNNER_TEMP}/stage1.env"

      - name: Validate the operator inputs
        run: |
          uv run --project python thoth-control operations stage1-local-preflight             --env-file "${RUNNER_TEMP}/stage1.env"

      - name: Start the non-live services
        run: docker compose ${COMPOSE_FILE_ARGS} up -d --wait postgresql temporal temporal-ui api

      - name: Verify identity, storage, and loopback isolation
        run: |
          set -euo pipefail
          test "$(docker compose ${COMPOSE_FILE_ARGS} exec -T api id -u)" = "10001"
          test "$(docker compose ${COMPOSE_FILE_ARGS} exec -T api id -g)" = "10001"
          docker compose ${COMPOSE_FILE_ARGS} exec -T api test -w /var/lib/thoth/artifacts
          curl -fsS http://127.0.0.1:8000/healthz
          curl -fsS http://127.0.0.1:8000/readyz
          ports="$(docker compose ${COMPOSE_FILE_ARGS} ps --format '{{.Service}} {{.Ports}}')"
          echo "${ports}"
          echo "${ports}" | grep -q '^api .*127\.0\.0\.1:8000->8000'
          echo "${ports}" | grep -q '^temporal-ui .*127\.0\.0\.1:8080->8080'
          ! echo "${ports}" | grep -E '^(postgresql|temporal) ' | grep -q -- '->'

      - name: Verify the namespace survives a restart
        run: |
          set -euo pipefail
          describe="exec -T temporal temporal operator namespace describe"
          # shellcheck disable=SC2086
          docker compose ${COMPOSE_FILE_ARGS} ${describe}             --namespace thoth-stage1 --address temporal:7233
          docker compose ${COMPOSE_FILE_ARGS} restart postgresql temporal
          docker compose ${COMPOSE_FILE_ARGS} up -d --wait postgresql temporal
          # shellcheck disable=SC2086
          docker compose ${COMPOSE_FILE_ARGS} ${describe}             --namespace thoth-stage1 --address temporal:7233

      - name: Dump service logs on failure
        if: failure()
        run: docker compose ${COMPOSE_FILE_ARGS} logs --no-color --tail 120

      - name: Stop the stack
        if: always()
        run: docker compose ${COMPOSE_FILE_ARGS} down --remove-orphans
