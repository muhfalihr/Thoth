<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 160" width="560" height="160" role="img" aria-label="Thoth — AI short-form video strategist">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE680"/>
      <stop offset="0.55" stop-color="#FFD60A"/>
      <stop offset="1" stop-color="#F4A91C"/>
    </linearGradient>
  </defs>

  <!-- card -->
  <rect x="2" y="2" width="556" height="156" rx="28" fill="#14181f"/>
  <rect x="3.5" y="3.5" width="553" height="153" rx="26.5" fill="none" stroke="#FFD60A" stroke-opacity="0.28" stroke-width="2"/>

  <!-- minimal feather mark -->
  <g transform="translate(86 80) rotate(-14) scale(0.86)">
    <path d="M 0 -66 C 26 -34 28 30 0 62 C -28 30 -26 -34 0 -66 Z" fill="url(#gold)"/>
    <path d="M 0 -54 L 0 60" stroke="#14181f" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M 0 62 L 0 86" stroke="url(#gold)" stroke-width="5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- wordmark + tagline -->
  <text x="170" y="82" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="62" font-weight="800" fill="url(#gold)" letter-spacing="0.5">Thoth</text>
  <text x="173" y="114" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17.5" font-weight="500" fill="#9aa4b2" letter-spacing="0.3">AI short-form video strategist</text>
</svg>
