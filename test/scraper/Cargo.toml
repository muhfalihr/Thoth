[package]
name = "scraper"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow    = "1"
tokio     = { version = "1", features = ["full"] }
reqwest   = { version = "0.12", features = ["json", "gzip", "deflate", "brotli", "rustls-tls"] }
serde_json = "1"
clap      = { version = "4", features = ["derive"] }
