[project]
name = "thoth-control-plane"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "agno>=3,<4",
    "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.6,<3",
  "temporalio>=1.10,<2",
  "typer>=0.15,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
acquisition = ["scrapling[fetchers]>=0.4.15,<0.5"]

[project.scripts]
thoth-control = "thoth_control_plane.cli:app"

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "respx>=0.22,<1",
    "ruff>=0.8,<1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "live: requires explicit public provider fixture and installed browser dependencies",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thoth_control_plane"]
